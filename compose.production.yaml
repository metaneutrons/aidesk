# The product from the production image: web server, worker and migrations, with a
# database and an object storage of its own or yours. Nothing secret is in this file or
# in the image; every value comes from the environment (a `.env.production` next to this
# file, mode 0600, passed with --env-file, or the variables of your deployment tool).
#
#   docker compose --env-file .env.production --profile bundled -f compose.production.yaml up -d --build
#
# Required: APP_URL, BETTER_AUTH_SECRET (32 characters or more), ENCRYPTION_KEY (64 hex
# characters), S3_ACCESS_KEY, S3_SECRET_KEY, and POSTGRES_PASSWORD unless DATABASE_URL is
# given. OWNER_CLAIM_TOKEN (32 characters or more) is needed once, to claim the first
# owner at /setup; remove it afterwards.
#
# The profile `bundled` is the database and the storage that come with this file. For your
# own, leave the profile off, give DATABASE_URL and S3_ENDPOINT (and S3_REGION, S3_BUCKET)
# and start without it:
#   docker compose --env-file .env.production -f compose.production.yaml up -d --build
#
# The profile `proxy` adds Caddy with TLS in front of the web server (ports 80 and 443). It needs
# SITE_ADDRESS, the host name of APP_URL, and gets a certificate from Let's Encrypt by itself:
#   COMPOSE_PROFILES=bundled,proxy
# Without it, put a proxy of your own in front of the port of the web server.
#
# The profile `updater` adds the updater: it finds the latest release, checks the signature of
# its image (cosign, keyless, the release workflow of this repository), dumps the bundled
# database, replaces the web server and the worker, and puts the old image back when the new
# one does not become ready. It needs the Docker socket, which is as good as root on this
# machine: run it only where you accept that, and keep UPDATER_TOKEN (32 characters or more,
# `openssl rand -hex 32`) secret. The owner starts an update on the settings page.
#   COMPOSE_PROFILES=bundled,proxy,updater
# It writes AIDESK_IMAGE and UPDATER_IMAGE into the environment file (AIDESK_ENV_FILE, default
# .env.production), so that a later `docker compose up` keeps the version that was installed.
# Start from a release instead of a local build by pulling its image first:
#   docker pull ghcr.io/metaneutrons/aidesk:<version>
#   AIDESK_IMAGE=ghcr.io/metaneutrons/aidesk:<version> docker compose ... up -d --no-build
name: aidesk
x-image: &image
  # A local build by the app service, or the image of a release (AIDESK_IMAGE, set by the
  # updater). The others use the same image.
  image: ${AIDESK_IMAGE:-aidesk-production}
  pull_policy: never
x-environment: &environment
  NODE_ENV: production
  APP_URL: ${APP_URL:?The address the product is reached at, for example https://desk.example.org}
  DATABASE_URL: ${DATABASE_URL:-postgresql://aidesk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or DATABASE_URL}@postgres:5432/aidesk}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?32 characters or more}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?64 hexadecimal characters}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-aidesk}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  # Taken from the environment when it is set there, and not passed on otherwise.
  OWNER_CLAIM_TOKEN:
  OWNER_RECOVERY_TOKEN:
  # Only while the keys are rotated (see "Rotating the keys" in docs/development.md).
  ENCRYPTION_KEY_PREVIOUS:
  BETTER_AUTH_SECRET_PREVIOUS:
  BETTER_AUTH_SECRET_VERSION:
services:
  postgres:
    profiles: [bundled]
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidesk
      POSTGRES_USER: aidesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidesk -d aidesk"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    profiles: [bundled]
    # PGSTY Silo (S3-compatible, AGPL-3.0, a separate service). The S3 API stays inside
    # the Compose network and nothing is published.
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    command: ["silo", "server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes: ["silo-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Applies the migrations and creates the bucket of the storage, then ends. The web
  # server and the worker start after it.
  migrate:
    <<: *image
    command: ["node_modules/.bin/tsx", "scripts/migrate.ts"]
    restart: "no"
    healthcheck: { disable: true }
    read_only: true
    tmpfs: ["/tmp"]
    environment: *environment
    depends_on:
      postgres: { condition: service_healthy, required: false }
  app:
    <<: *image
    build:
      context: .
      target: production
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      <<: *environment
      # Longer than the idle time of a proxy in front, which closes connections itself.
      KEEP_ALIVE_TIMEOUT: ${KEEP_ALIVE_TIMEOUT:-65000}
      # The updater of the profile `updater`, which the owner reaches from the settings page. Without a token the page
      # says that there is none.
      UPDATER_URL: ${UPDATER_URL:-http://updater:8080}
      UPDATER_TOKEN:
    # TLS is for a proxy in front of this port; it is published to this machine only.
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_healthy, required: false }
  worker:
    <<: *image
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    restart: unless-stopped
    # The check of the image asks the web server, which the worker does not run.
    healthcheck: { disable: true }
    read_only: true
    # The reader of documents is built here when the worker starts.
    tmpfs: ["/tmp"]
    environment: *environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_healthy, required: false }
  proxy:
    profiles: [proxy]
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    # Compose resolves `${SITE_ADDRESS:?}` for a service of an inactive profile too, which would
    # stop every installation without the proxy. The check is made here, where the profile is on.
    command:
      - sh
      - -c
      - 'test -n "$$SITE_ADDRESS" || { echo "SITE_ADDRESS is required for the proxy profile: the host name that the product is reached at, for example desk.example.org" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./config/caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      app: { condition: service_healthy }
  updater:
    profiles: [updater]
    # Pinned to its own version by the updater after the first swap.
    image: ${UPDATER_IMAGE:-ghcr.io/metaneutrons/aidesk-updater:latest}
    restart: unless-stopped
    environment:
      # Not `:?`: Compose resolves that for services of inactive profiles too, which would stop
      # every installation without the updater. The updater itself refuses to start without a
      # token of 32 characters or more.
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      POLL_INTERVAL_SECONDS: ${UPDATER_POLL_INTERVAL_SECONDS:-3600}
      # Nothing is installed without the owner, unless this is true (or the page says so).
      AUTO_APPLY: ${UPDATER_AUTO_APPLY:-false}
      MAINTENANCE_TIME: ${UPDATER_MAINTENANCE_TIME:-02:00}
      TZ: ${TZ:-UTC}
      # false when the database is yours: the updater can only dump the bundled one.
      BACKUP_ENABLED: ${UPDATER_BACKUP_ENABLED:-true}
      BACKUP_RETENTION_DAYS: ${UPDATER_BACKUP_RETENTION_DAYS:-14}
      # false keeps the updater as it is when the product is updated (see docs/updating.md).
      AUTO_UPDATE_UPDATER: ${UPDATER_SELF_UPDATE:-true}
      # Raises the limit of the GitHub API for the check of the release; not needed otherwise.
      GITHUB_TOKEN:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The updater reads the compose file and writes the image pins into the environment file.
      # Both must exist: Docker would make a directory of a missing source.
      - ./compose.production.yaml:/stack/compose.production.yaml:ro
      - ${AIDESK_ENV_FILE:-.env.production}:/stack/env.production
      - updater-state:/state
      - updater-backups:/backups
    depends_on:
      app: { condition: service_healthy }
volumes:
  postgres-data:
  silo-data:
  caddy-data:
  caddy-config:
  updater-state:
  updater-backups:
