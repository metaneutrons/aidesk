name: Release Image
# Started by release-please.yml for the tag of a release (`gh workflow run release-image.yml --ref vX.Y.Z`); it has no
# trigger of its own, so that a tag does not start two pipelines. The release is a draft until the image is signed
# and checked; this workflow publishes it last. Two images are made from one tag, the product and the updater of the
# Compose installation (deploy/updater), with the same version and the same signing identity, so that the updater
# checks one identity for both.
on:
  workflow_dispatch:

concurrency:
  group: release-image-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # What the signature of the image must say: this workflow, run for a release tag of this repository.
  COSIGN_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_IDENTITY: ^https://github\.com/metaneutrons/aidesk/\.github/workflows/release-image\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only a release tag is built
        env:
          REF: ${{ github.ref }}
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Run this workflow for a release tag (refs/tags/vX.Y.Z), not for $REF."
            exit 1
          fi

  # Each architecture is built on its native runner and pushed by digest, with a software bill of materials and a
  # provenance attestation.
  build:
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: aidesk
            image: ghcr.io/${{ github.repository_owner }}/aidesk
            context: .
            target: production
            platform: linux/amd64
            runner: ubuntu-latest
          - component: aidesk
            image: ghcr.io/${{ github.repository_owner }}/aidesk
            context: .
            target: production
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: updater
            image: ghcr.io/${{ github.repository_owner }}/aidesk-updater
            context: deploy/updater
            target: ""
            platform: linux/amd64
            runner: ubuntu-latest
          - component: updater
            image: ghcr.io/${{ github.repository_owner }}/aidesk-updater
            context: deploy/updater
            target: ""
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare the platform label
        run: echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          # The label org.opencontainers.image.version is the version without the v, as the tags are; the updater
          # reads it to know what runs.
          tags: type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # The updater says which version it is (reported to the settings page, and the deciding of its own update).
          build-args: ${{ matrix.component == 'updater' && format('UPDATER_VERSION={0}', steps.meta.outputs.version) || '' }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=min,scope=${{ matrix.component }}-${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One manifest of both architectures for each image, tagged and signed keyless with cosign (Sigstore, Rekor transparency
  # log). The digest that was signed is kept for the next jobs as a file, because the outputs of a matrix job do not
  # carry one value for each leg.
  merge:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: aidesk
            image: ghcr.io/${{ github.repository_owner }}/aidesk
          - component: updater
            image: ghcr.io/${{ github.repository_owner }}/aidesk-updater
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest and push the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mapfile -t TAGS < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do TAG_ARGS+=("-t" "$tag"); done
          SOURCES=()
          for digest in ./*; do SOURCES+=("${IMAGE}@sha256:${digest#./}"); done
          # One digest for each architecture, and nothing else in the directory.
          [ "${#SOURCES[@]}" -eq 2 ] || { echo "::error::expected two digests, found ${#SOURCES[@]}"; exit 1; }
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

      - name: Capture the digest of the manifest
        id: digest
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          d=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$'
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s' "$d" > "${RUNNER_TEMP}/digest/${{ matrix.component }}"
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # --recursive signs each per-architecture manifest as well, so that a check by the digest of one platform passes.
      - name: Sign the image
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}
          path: ${{ runner.temp }}/digest/${{ matrix.component }}
          if-no-files-found: error
          retention-days: 1

  # What was signed is checked the way the updater will check it, from outside, before the release is published.
  verify:
    needs: merge
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: aidesk
            image: ghcr.io/${{ github.repository_owner }}/aidesk
          - component: updater
            image: ghcr.io/${{ github.repository_owner }}/aidesk-updater
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: digest-${{ matrix.component }}
          path: ${{ runner.temp }}/digest

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the signature against the identity of this workflow
        env:
          IMAGE: ${{ matrix.image }}
          COMPONENT: ${{ matrix.component }}
        run: |
          DIGEST="$(cat "${RUNNER_TEMP}/digest/${COMPONENT}")"
          cosign verify \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            --certificate-identity-regexp "$COSIGN_IDENTITY" \
            "${IMAGE}@${DIGEST}" > /dev/null

      # A signature of another identity must be refused: the counter-probe of the check above.
      - name: Refuse a wrong identity
        env:
          IMAGE: ${{ matrix.image }}
          COMPONENT: ${{ matrix.component }}
        run: |
          DIGEST="$(cat "${RUNNER_TEMP}/digest/${COMPONENT}")"
          if cosign verify \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            --certificate-identity-regexp '^https://github\.com/metaneutrons/not-aidesk/' \
            "${IMAGE}@${DIGEST}" > /dev/null 2>&1; then
            echo "::error::A wrong identity was accepted."
            exit 1
          fi

      # The updater reads the version of what runs from this label, so each architecture of each image has to carry the
      # version of the release. The shape of the answer (one entry for each platform) was tried on an image of
      # another repository of the same kind.
      - name: The version label of every architecture is the version of the release
        env:
          IMAGE: ${{ matrix.image }}
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ github.ref_name }}
        run: |
          DIGEST="$(cat "${RUNNER_TEMP}/digest/${COMPONENT}")"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Image}}' |
            jq -e --arg v "${TAG#v}" \
              'length == 2 and ([.[] | .config.Labels["org.opencontainers.image.version"]] | all(. == $v))' > /dev/null ||
            { echo "::error::an architecture of ${IMAGE} does not carry the version label ${TAG#v}"; exit 1; }

  publish:
    needs: [merge, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true

      - name: Publish the release and make it the latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          notes=$(printf '%s\n\nImage: %s\nUpdater image: %s\n' "$body" \
            "ghcr.io/${OWNER}/aidesk@$(cat "${RUNNER_TEMP}/digest/aidesk")" \
            "ghcr.io/${OWNER}/aidesk-updater@$(cat "${RUNNER_TEMP}/digest/updater")")
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes "$notes"
