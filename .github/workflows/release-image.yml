name: Release Image
# Started by release-please.yml for the tag of a release (`gh workflow run release-image.yml --ref vX.Y.Z`); it has no
# trigger of its own, so that a tag does not start two pipelines. The release is a draft until the image is signed
# and checked; this workflow publishes it last.
on:
  workflow_dispatch:

concurrency:
  group: release-image-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aidesk
  # What the signature of the image must say: this workflow, run for a release tag of this repository.
  COSIGN_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_IDENTITY: ^https://github\.com/metaneutrons/aidesk/\.github/workflows/release-image\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only a release tag is built
        env:
          REF: ${{ github.ref }}
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Run this workflow for a release tag (refs/tags/vX.Y.Z), not for $REF."
            exit 1
          fi

  # Each architecture is built on its native runner and pushed by digest, with a software bill of materials and a
  # provenance attestation.
  build:
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare the platform label
        run: echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: production
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=min,scope=${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One manifest of both architectures, tagged and signed keyless with cosign (Sigstore, Rekor transparency log).
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest and push the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t TAGS < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do TAG_ARGS+=("-t" "$tag"); done
          SOURCES=()
          for digest in ./*; do SOURCES+=("${IMAGE_NAME}@sha256:${digest#./}"); done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

      - name: Capture the digest of the manifest
        id: digest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          d=$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # --recursive signs each per-architecture manifest as well, so that a check by the digest of one platform passes.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE_NAME}@${DIGEST}"

  # What was signed is checked the way the updater will check it, from outside, before the release is published.
  verify:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the signature against the identity of this workflow
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            --certificate-identity-regexp "$COSIGN_IDENTITY" \
            "${IMAGE_NAME}@${DIGEST}" > /dev/null

      # A signature of another identity must be refused: the counter-probe of the check above.
      - name: Refuse a wrong identity
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          if cosign verify \
            --certificate-oidc-issuer "$COSIGN_ISSUER" \
            --certificate-identity-regexp '^https://github\.com/metaneutrons/not-aidesk/' \
            "${IMAGE_NAME}@${DIGEST}" > /dev/null 2>&1; then
            echo "::error::A wrong identity was accepted."
            exit 1
          fi

  publish:
    needs: [merge, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release and make it the latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          notes=$(printf '%s\n\nImage: %s@%s\n' "$body" "$IMAGE_NAME" "$DIGEST")
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --notes "$notes"
