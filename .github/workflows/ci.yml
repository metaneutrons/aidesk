name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['26']
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_DB: aidesk_test
          POSTGRES_USER: aidesk
          POSTGRES_PASSWORD: aidesk-ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aidesk -d aidesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://aidesk:aidesk-ci-test-only@127.0.0.1:5432/aidesk_test
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: aidesk-ci-access
      S3_SECRET_KEY: aidesk-ci-test-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # NOT corepack: from Node 25 on it is no longer part of the
      # distribution, `corepack enable` breaks on Node 26. pnpm/action-setup
      # reads the version from the packageManager field of package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # --frozen-lockfile fails when the lockfile does not match package.json.
      # That is exactly what it is for.
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # lefthook is a devDependency, so no download is needed.
      - name: Check the hook configuration
        run: pnpm exec lefthook validate
      - run: pnpm typecheck
      - run: pnpm check:catalogs
      - run: pnpm build
      # Inbound tests store originals in real object storage. Service
      # containers cannot pass Silo's server command, so start it here.
      - name: Start object storage for the integration tests
        run: |
          docker run -d --name silo -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            silo server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 2
          done
          docker logs silo
          exit 1
      - name: Start the mailbox server for the IMAP tests
        run: |
          docker run -d --name greenmail -p 127.0.0.1:3025:3025 -p 127.0.0.1:3143:3143 \
            -e GREENMAIL_OPTS="-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled" \
            greenmail/standalone@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/3143) 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs greenmail
          exit 1
      - run: pnpm test --coverage
      - run: pnpm check:gates
      - name: Check the package content
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/*.tgz | sort

  security:
    name: Secrets and advisories
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'
          # If required for organisation use: a narrowly scoped CI tooling
          # secret, never one from a publish environment.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate

  commit-hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check title, body and every commit
        # Title and body reach the script exclusively through env, never by
        # interpolation into the script text: otherwise the pull request title
        # would be a shell injection vector.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          cc='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Revert ".+")'
          # grep works line by line, hence .* rather than [^\n]*: in ERE
          # [^\n] would be the class "neither a backslash nor an n" and would
          # exclude names containing an 'n'. In the RE2 rule of the ruleset
          # [^\n] is the correct one. Anchored at the start of the line: by
          # convention a trailer stands on a line of its own. Without the anchor
          # the rule also fires when a pull request body merely mentions the
          # forbidden trailer, for instance to describe a doctor finding, and it
          # then rejects a valid input.
          ban='^[[:space:]]*co-authored-by:.*(claude|anthropic)|^[[:space:]]*generated with.*claude code'

          # On a squash merge the pull request title becomes the subject line
          # on main and thereby determines the next version.
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$cc"; then
            echo "::error::pull request title does not follow Conventional Commits: $PR_TITLE"
            status=1
          fi

          # With squash_merge_commit_message=PR_BODY the body lands in the commit.
          if printf '%s' "$PR_BODY" | grep -Eiq "$ban"; then
            echo "::error::the pull request body contains an AI attribution trailer."
            status=1
          fi

          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format=%B "$sha" | grep -Eiq "$ban"; then
              echo "::error::commit $sha contains an AI attribution trailer."
              status=1
            fi
            email=$(git log -1 --format='%ae%n%ce' "$sha")
            if printf '%s' "$email" | grep -Fq 'noreply@anthropic.com'; then
              echo "::error::commit $sha has an Anthropic address as author or committer."
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "::notice::switch this off for good in ~/.claude/settings.json: {\"attribution\":{\"commit\":\"\",\"pr\":\"\"}}"
            exit 1
          fi

  browser:
    name: Browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # The suite took 33 to 42 minutes on one runner (the limit of 45 cancelled a run on 23 October with 315 tests green
    # and none failed). It is split over three runners, each with a stack of its own, so that the job takes about a third
    # of that plus the set-up.
    timeout-minutes: 45
    strategy:
      # A failure in one part does not hide what the other parts found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The checkout belongs to the runner user (UID 1001) while the
      # development containers run as other users on the bind mount, and the
      # Next.js dev server writes into the project directory. Generate the
      # private credential files first (mode 0600), so the permission change
      # also reaches them; they exist only for this throwaway run.
      - name: Generate credentials and open the checkout to the containers
        run: |
          sh scripts/dev.sh config --quiet
          chmod -R a+rwX .
      - name: Start the development stack
        run: sh scripts/dev.sh up --build -d
      - name: Wait for readiness and compile the first pages
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if curl -fsS http://localhost:3000/api/health/ready >/dev/null; then
              curl -fsS -o /dev/null http://localhost:3000/login
              exit 0
            fi
            sleep 2
          done
          echo "::error::the development stack did not become ready"
          exit 1
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - name: List the tests that passed only on the repeat
        if: always()
        run: |
          if [ -f test-results/results.json ]; then pnpm exec tsx scripts/flaky-report.ts; fi
      # What helps to find out why a test needed a repeat: the requests that took a second or more and the answers with an
      # error, and the passes of the worker that took long. They are shown for every run, because a run that passed on a repeat
      # leaves nothing else behind.
      - name: Show the slow and failed requests of the stack
        if: always()
        run: |
          sh scripts/dev.sh logs --no-color --tail 40000 app > app.log || true
          echo "Requests of one second or more:"
          grep -E " in [0-9.]+s " app.log | grep -v "/api/health/" | tail -40 || true
          echo "Answers with a server error:"
          grep -E " 5[0-9]{2} in " app.log | grep -v "/api/health/" | tail -40 || true
          sh scripts/dev.sh logs --no-color --tail 40000 worker > worker.log || true
          echo "Slow passes of the worker:"
          grep "worker.pass_slow" worker.log | tail -40 || true
      - name: Show the stack logs
        if: failure()
        run: sh scripts/dev.sh logs --no-color --tail 300
      # The traces of a test that failed on its first try are in the report, also when the run passed on the repeat.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Production image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the image that runs
        run: docker build --target production --tag aidesk-production:ci --tag aidesk-production .
      # The reader of documents runs in a closed process of Node's permission model that
      # is started through /bin/sh; the image has to be able to do that.
      - name: The closed process of the reader works in the image
        run: docker run --rm aidesk-production:ci node_modules/.bin/tsx scripts/smoke.ts
      - name: The process is not root and cannot write the application files
        run: docker run --rm aidesk-production:ci sh -c 'test "$(id -u)" != 0 && ! test -w /app'
      # The Compose setup from a clean state: ready, a restart, a backup, the loss of the
      # volumes and the restore, with throwaway values that exist only for this run.
      - name: The Compose setup starts, is backed up and is restored
        run: |
          set -euo pipefail
          umask 077
          {
            echo APP_URL=http://localhost:3000
            echo COMPOSE_PROFILES=bundled,proxy
            echo SITE_ADDRESS=localhost
            echo 'TLS_DIRECTIVE=tls internal'
            echo PROXY_HTTPS_PORT=8443
            echo PROXY_HTTP_PORT=8080
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "S3_ACCESS_KEY=$(openssl rand -hex 8)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 16)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 24)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } > .env.check
          ENV_FILE=.env.check sh scripts/check-production.sh

  ci-success:
    name: CI Success
    if: always()
    needs: [quality, security, commit-hygiene, browser, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Every preceding job must have succeeded or been skipped
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJSON(needs) }}' |
            jq -e 'all(.[]; .result == "success" or .result == "skipped")'
