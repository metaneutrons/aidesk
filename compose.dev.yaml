name: aidesk-dev
services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: aidesk
      POSTGRES_USER: aidesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/dev.sh up first}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidesk -d aidesk"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    # PGSTY Silo RELEASE.2026-09-16T00-00-00Z (S3-compatible, AGPL-3.0, separate
    # service). The S3 API stays inside the Compose network; the console is
    # published to localhost for inspecting objects.
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["silo", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:9001:9001"]
    volumes: ["silo-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
  # Development identity provider for real OIDC and SAML sign-in. The browser
  # reaches it on localhost:8080; the app uses the same issuer URL for tokens
  # and the container name for its back channel.
  keycloak:
    image: quay.io/keycloak/keycloak@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      DEV_SSO_OIDC_CLIENT_SECRET: ${DEV_SSO_OIDC_CLIENT_SECRET}
      DEV_SSO_USER_PASSWORD: ${DEV_SSO_USER_PASSWORD}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./config/keycloak:/opt/keycloak/data/import:ro"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
  # HTTPS entry point with a local CA, for MCP and REST clients that require
  # TLS. Browsers keep using http://localhost:3000.
  https:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      app:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    environment:
      MP_MAX_MESSAGES: 500
  app:
    build:
      context: .
      target: development
    environment: &app-environment
      NODE_ENV: development
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://aidesk:${POSTGRES_PASSWORD}@postgres:5432/aidesk
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: aidesk
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DEV_BOOTSTRAP: "true"
      DEV_OWNER_EMAIL: owner@aidesk.local
      DEV_OWNER_PASSWORD: ${DEV_OWNER_PASSWORD}
      DEV_SMTP_HOST: mailpit
      DEV_SMTP_PORT: "1025"
      # The source and .git are bind-mounted from the host. Hooks installed here
      # would point the host's Git at binaries that exist only in this container.
      AIDESK_SKIP_GIT_HOOKS: "true"
      DEV_SSO_ISSUER: http://localhost:8080/realms/aidesk
      DEV_SSO_INTERNAL_URL: http://keycloak:8080/realms/aidesk
      DEV_SSO_OIDC_CLIENT_SECRET: ${DEV_SSO_OIDC_CLIENT_SECRET}
      # The development IdP is on a private network; Better Auth only fetches
      # from such hosts when their origins are trusted explicitly.
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:8080,http://keycloak:8080
      # Host edits do not raise file events inside Colima/virtiofs containers.
      # Set NEXT_WATCH_POLL_MS=0 in .env.development where file events work.
      NEXT_WATCH_POLL_MS: ${NEXT_WATCH_POLL_MS:-1000}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - .:/app
      - app-dependencies:/app/node_modules
      - app-store:/pnpm/store
      - app-next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
  worker:
    build:
      context: .
      target: development
    environment: *app-environment
    command: ["pnpm", "worker"]
    volumes:
      - .:/app
      - app-dependencies:/app/node_modules
      - app-store:/pnpm/store
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy-data:
  postgres-data:
  silo-data:
  app-dependencies:
  app-store:
  app-next:
