name: aidesk-dev
services:
  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: aidesk
      POSTGRES_USER: aidesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/dev.sh up first}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidesk -d aidesk"]
      interval: 3s
      timeout: 3s
      retries: 20
  storage:
    # PGSTY Silo RELEASE.2026-09-16T00-00-00Z (S3-compatible, AGPL-3.0, separate
    # service). The S3 API stays inside the Compose network; the console is
    # published to localhost for inspecting objects.
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["silo", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:9001:9001"]
    volumes: ["silo-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    environment:
      MP_MAX_MESSAGES: 500
  app:
    build:
      context: .
      target: development
    environment: &app-environment
      NODE_ENV: development
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://aidesk:${POSTGRES_PASSWORD}@postgres:5432/aidesk
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: aidesk
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DEV_BOOTSTRAP: "true"
      DEV_OWNER_EMAIL: owner@aidesk.local
      DEV_OWNER_PASSWORD: ${DEV_OWNER_PASSWORD}
      DEV_SMTP_HOST: mailpit
      DEV_SMTP_PORT: "1025"
      # The source and .git are bind-mounted from the host. Hooks installed here
      # would point the host's Git at binaries that exist only in this container.
      AIDESK_SKIP_GIT_HOOKS: "true"
      # Host edits do not raise file events inside Colima/virtiofs containers.
      # Set NEXT_WATCH_POLL_MS=0 in .env.development where file events work.
      NEXT_WATCH_POLL_MS: ${NEXT_WATCH_POLL_MS:-1000}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - .:/app
      - app-dependencies:/app/node_modules
      - app-store:/pnpm/store
      - app-next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
  worker:
    build:
      context: .
      target: development
    environment: *app-environment
    command: ["pnpm", "worker"]
    volumes:
      - .:/app
      - app-dependencies:/app/node_modules
      - app-store:/pnpm/store
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres-data:
  silo-data:
  app-dependencies:
  app-store:
  app-next:
